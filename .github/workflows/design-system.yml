name: Design System

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:design-system:static
      - name: Enforce Programa General pilot contract
        run: node tests/test_programa_general_sprint_contract.mjs

  design-system-runtime:
    runs-on: ubuntu-latest
    needs: design-system-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated runtime target
        env:
          COMPOSE_PROJECT_NAME: lps-aia-design-system-ci
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: node scripts/design-system-ci-preflight.mjs
      - name: Start isolated runtime
        run: docker compose -p lps-aia-design-system-ci -f docker-compose.yml -f docker-compose.ci.yml up -d --build db app
      - name: Wait for the application
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p lps-aia-design-system-ci -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1
      - name: Enforce PHPStan baseline
        env:
          COMPOSE_PROJECT_NAME: lps-aia-design-system-ci
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: npm run test:design-system:phpstan
      - name: Enforce global-table safety
        run: docker compose -p lps-aia-design-system-ci -f docker-compose.yml -f docker-compose.ci.yml exec -T app php tests/test_global_table_safety.php
      - name: Run laboratory gates
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:runtime
      - name: Run Programa General persistence and RBAC gate
        env:
          COMPOSE_PROJECT_NAME: lps-aia-design-system-ci
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
          E2E_WORKERS: "1"
          E2E_HEADLESS: "true"
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/tests/workflows/pg-interactions.spec.mjs --workers=1
      - name: Preserve runtime logs
        if: failure()
        run: |
          mkdir -p test-output
          docker compose -p lps-aia-design-system-ci -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > test-output/docker-compose.log || true
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-failure-evidence
          path: |
            test-results/
            test-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated runtime
        if: always()
        run: docker compose -p lps-aia-design-system-ci -f docker-compose.yml -f docker-compose.ci.yml down --volumes
