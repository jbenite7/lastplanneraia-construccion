name: Design System

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main history for design-system contracts
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --build-arg COMPOSER_INSTALL_FLAGS="" para que la imagen traiga PHPUnit, que es
      # dependencia de desarrollo y sin ella el runner del paso siguiente aborta con 2 en
      # cuanto exista un test de nivel `puro` en tests/unit/. No se toca docker/php/Dockerfile
      # ni docker-compose.ci.yml: sus tres líneas de COMPOSER_INSTALL_FLAGS están fijadas por
      # tests/design-system/visual-ci-contract.test.mjs:143-145.
      - name: Build the PHP test runtime
        run: docker compose -f docker-compose.yml build --build-arg COMPOSER_INSTALL_FLAGS="" app
      # -f docker-compose.yml a propósito, para NO aplicar docker-compose.override.yml:
      # el override monta el checkout sobre /var/www/html y taparía el vendor/ que trae
      # la imagen, y este job no ejecuta composer install (vendor/ está en .gitignore).
      - name: Correr los tests PHP que no necesitan entorno
        run: docker compose -f docker-compose.yml run --rm --no-deps app php scripts/run-php-tests.php --nivel=puro
      - name: Enforce design-system static gates
        env:
          DS_ACTIVATION_STRICT: "1"
        run: npm run test:design-system:static
      - name: Enforce Programa General pilot contract
        run: node tests/test_programa_general_sprint_contract.mjs

  design-system-runtime:
    runs-on: ubuntu-latest
    needs: design-system-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture runtime provenance
        id: runtime-provenance
        shell: bash
        run: |
          set -euo pipefail
          CI_RUN_ID=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          COMPOSE_PROJECT_NAME=lps-aia-design-system-ci-${CI_RUN_ID}
          provenance="$(node scripts/design-system-ci-preflight.mjs --print-provenance)"
          CI_GIT_SHA="$(awk -F= '$1 == "CI_GIT_SHA" { print $2 }' <<< "${provenance}")"
          CI_WORKTREE_FINGERPRINT="$(awk -F= '$1 == "CI_WORKTREE_FINGERPRINT" { print $2 }' <<< "${provenance}")"
          CI_FIXTURE_SHA256="$(awk -F= '$1 == "CI_FIXTURE_SHA256" { print $2 }' <<< "${provenance}")"
          for required_value in "${CI_GIT_SHA}" "${CI_WORKTREE_FINGERPRINT}" "${CI_FIXTURE_SHA256}"; do
            if ! grep -Eq '^[a-f0-9]+$' <<< "${required_value}"; then
              echo "Incomplete runtime provenance" >&2
              exit 1
            fi
          done
          {
            echo "CI_RUN_ID=${CI_RUN_ID}"
            echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml"
            echo "CI_GIT_SHA=${CI_GIT_SHA}"
            echo "CI_WORKTREE_FINGERPRINT=${CI_WORKTREE_FINGERPRINT}"
            echo "CI_FIXTURE_SHA256=${CI_FIXTURE_SHA256}"
          } >> "${GITHUB_ENV}"
      - name: Verify isolated runtime target
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: node scripts/design-system-ci-preflight.mjs
      - name: Start isolated runtime
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml up -d --build db app
      - name: Wait for the application
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1
      - name: Enforce PHPStan baseline
        run: npm run test:design-system:phpstan
      - name: Enforce PHPStan level 6 on the PDC module
        run: npm run test:pdc:phpstan
      # Sustituye a los tres tests que antes se listaban aquí a mano (test_global_table_safety,
      # test_dev_door_guard, test_dev_door_http): los tres siguen corriendo, ahora dentro de la
      # selección del runner junto a los ~70 que nadie ejecutaba automáticamente. El paso
      # explícito que duplicaba el primero se retiró el 2026-08-11 (decisión D-CI-1), cuando el
      # contrato pasó a comprobar que el CI lo ejecuta en vez de que lo nombra.
      - name: Correr la suite PHP completa que el CI puede honrar
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml exec -T app php scripts/run-php-tests.php --nivel=http
      # F-AB (2026-08-12): los dos gates que constaban `blocked` se enchufan AQUI,
      # antes de «Run laboratory gates», y no despues. Motivo medido: ese paso
      # falla hoy por goldens de una sola plataforma (D-GAC-4, abierta), y cuando
      # un paso falla GitHub salta todos los posteriores — por eso el gate de
      # persistencia de :144 no llego a ejecutarse en la corrida 31561660136.
      # Puestos aqui corren de verdad y dan procedencia real sin tocar un golden.
      # La app y la base aislada ya estan levantadas desde antes de :105, y las
      # cuatro variables CI_* ya vienen de «Capture runtime provenance» (:60-83):
      # NO se redeclaran, porque redeclararlas es el primer paso hacia fabricarlas.
      - name: Enforce full-app-flow gate
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: npx playwright test tests/browser/full-app-flow.spec.mjs --workers=1
      - name: Measure runtime budgets
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:runtime-budget:measure
      - name: Check runtime budgets against the baseline
        run: npm run test:runtime-budget:check
      - name: Run laboratory gates
        id: blocking-runtime
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:runtime
      - name: Run pilot lab gates (Programa General)
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: |
          npm run test:visual:pilot
          npm run test:a11y:pilot
          npm run test:hue:pilot
      - name: Collect keyboard and reflow evidence
        id: keyboard-reflow-evidence
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:evidence
      - name: Preserve non-blocking evidence failures
        if: steps.keyboard-reflow-evidence.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: design-system-keyboard-reflow-evidence
          path: |
            test-results/
            test-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Run Programa General persistence and RBAC gate
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
          E2E_WORKERS: "1"
          E2E_HEADLESS: "true"
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/tests/workflows/pg-interactions.spec.mjs --workers=1
      - name: Preserve runtime logs
        if: failure()
        run: |
          mkdir -p test-output
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > test-output/docker-compose.log || true
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-failure-evidence
          path: |
            test-results/
            test-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated runtime
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml down --volumes
