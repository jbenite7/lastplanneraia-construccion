name: Design System

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sin esto, `docker-compose.override.yml` monta sobre /var/www/html la ruta absoluta de la
    # máquina de desarrollo, que en un runner NO EXISTE. Docker no protesta: crea el directorio
    # vacío y lo monta igual, así que el código desaparece del contenedor y los cuatro tests de
    # tests/design-system/foundation.test.mjs que ejecutan PHP caen con «Failed opening required
    # 'src/...'». El carril `node-tests` se pone rojo, y como design-system-runtime lleva
    # `needs: design-system-static`, el job de runtime deja de arrancar entero — con el measure y
    # el check de runtime-budgets dentro, que es como ese gate se quedó sin poder medirse nunca.
    #
    # Regresión del 2026-08-18: 86fdca41 cambió el bind de `./:/var/www/html` (que en CI
    # funcionaba) a `${LPS_CODE_ROOT:-<ruta del host>}`, y 81debea8 lo reapuntó al repo mudado.
    # No se toca el override: resuelve un problema local real —varios worktrees compartiendo los
    # mismos contenedores— y no existe una ruta que valga a la vez aquí y en un runner. La
    # variable ES la salida que aquel commit dejó prevista y que CLAUDE.md documenta («en otra
    # maquina, define LPS_CODE_ROOT en tu .env con la ruta de tu clon»); un runner es otra
    # máquina, y su clon es el workspace.
    #
    # Va en el job y no en un paso a propósito: los pasos que invocan compose con
    # `-f docker-compose.yml` explícito NO aplican el override y siguen sin montar nada, que es lo
    # que quieren —el montaje taparía el vendor/ que trae la imagen—. Esta variable solo cambia
    # las llamadas a `docker compose` pelado, que son las que hacen los tests.
    #
    # Y NO se replica en design-system-runtime, también a propósito: ese job fija
    # COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml, así que el override nunca se le
    # aplica; montar el checkout ahí taparía el vendor/ de la imagen y rompería PHPStan y la
    # suite PHP. Allí el arreglo sería el daño.
    #
    # Comprobado en las dos direcciones ANTES de escribirlo, en un proyecto de compose aparte:
    # con la ruta inexistente sale el «Failed opening required» idéntico al del CI; con la
    # variable puesta, DesignSystemHeadComponent::render() y DesignSystemAssetController::main()
    # devuelven su HTML y su CSS.
    env:
      LPS_CODE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Fija versión y checksum a propósito: un linter que se descarga mutable
      # es la misma brecha que vino a cerrar.
      - name: Lint the workflow definitions
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint_1.7.12_linux_amd64.tar.gz actionlint_1.7.12_checksums.txt
      - name: Fetch main history for design-system contracts
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --build-arg COMPOSER_INSTALL_FLAGS="" para que la imagen traiga PHPUnit, que es
      # dependencia de desarrollo y sin ella el runner del paso siguiente aborta con 2 en
      # cuanto exista un test de nivel `puro` en tests/unit/. No se toca docker/php/Dockerfile
      # ni docker-compose.ci.yml: sus tres líneas de COMPOSER_INSTALL_FLAGS están fijadas por
      # tests/design-system/visual-ci-contract.test.mjs:143-145.
      - name: Build the PHP test runtime
        run: docker compose -f docker-compose.yml build --build-arg COMPOSER_INSTALL_FLAGS="" app
      # -f docker-compose.yml a propósito, para NO aplicar docker-compose.override.yml:
      # el override monta el checkout sobre /var/www/html y taparía el vendor/ que trae
      # la imagen, y este job no ejecuta composer install (vendor/ está en .gitignore).
      - name: Correr los tests PHP que no necesitan entorno
        run: docker compose -f docker-compose.yml run --rm --no-deps app php scripts/run-php-tests.php --nivel=puro
      - name: Enforce design-system static gates
        env:
          DS_ACTIVATION_STRICT: "1"
        run: npm run test:design-system:static
      - name: Enforce Programa General pilot contract
        run: node tests/test_programa_general_sprint_contract.mjs

  design-system-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: design-system-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture runtime provenance
        id: runtime-provenance
        shell: bash
        run: |
          set -euo pipefail
          CI_RUN_ID=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          COMPOSE_PROJECT_NAME=lps-aia-design-system-ci-${CI_RUN_ID}
          provenance="$(node scripts/design-system-ci-preflight.mjs --print-provenance)"
          CI_GIT_SHA="$(awk -F= '$1 == "CI_GIT_SHA" { print $2 }' <<< "${provenance}")"
          CI_WORKTREE_FINGERPRINT="$(awk -F= '$1 == "CI_WORKTREE_FINGERPRINT" { print $2 }' <<< "${provenance}")"
          CI_FIXTURE_SHA256="$(awk -F= '$1 == "CI_FIXTURE_SHA256" { print $2 }' <<< "${provenance}")"
          for required_value in "${CI_GIT_SHA}" "${CI_WORKTREE_FINGERPRINT}" "${CI_FIXTURE_SHA256}"; do
            if ! grep -Eq '^[a-f0-9]+$' <<< "${required_value}"; then
              echo "Incomplete runtime provenance" >&2
              exit 1
            fi
          done
          {
            echo "CI_RUN_ID=${CI_RUN_ID}"
            echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml"
            echo "CI_GIT_SHA=${CI_GIT_SHA}"
            echo "CI_WORKTREE_FINGERPRINT=${CI_WORKTREE_FINGERPRINT}"
            echo "CI_FIXTURE_SHA256=${CI_FIXTURE_SHA256}"
          } >> "${GITHUB_ENV}"
      - name: Verify isolated runtime target
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: node scripts/design-system-ci-preflight.mjs
      # El espejo sin comentarios se genera ANTES de construir la imagen, y el
      # orden es el hallazgo: `docker/php/Dockerfile` hace `COPY . /var/www/html`
      # en tiempo de build, asi que lo que no este en el arbol cuando se
      # construye no entra. Con el paso puesto DESPUES de arrancar el runtime, el
      # navegador siguio recibiendo el CSS con comentarios y el presupuesto solo
      # bajo 788 B de los 73.422 esperados.
      #
      # Va despues de `Capture runtime provenance`: el espejo esta en .gitignore
      # y no ensucia el arbol, pero la huella se toma antes igualmente.
      #
      # El nombre del paso evita las palabras que `visual-ci-contract.test.mjs`
      # veta en este archivo: ese guard existe para que el CI no tenga camino de
      # despliegue, y un guard que se ablanda por comodidad deja de valer.
      - name: Generate comment-free CSS as the live site serves it
        run: npm run css:minify && npm run css:minify:check && git status --porcelain
      - name: Start isolated runtime
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml up -d --build db app
      - name: Wait for the application
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1
      - name: Enforce PHPStan baseline
        run: npm run test:design-system:phpstan
      - name: Enforce PHPStan level 6 on the PDC module
        run: npm run test:pdc:phpstan
      # Sustituye a los tres tests que antes se listaban aquí a mano (test_global_table_safety,
      # test_dev_door_guard, test_dev_door_http): los tres siguen corriendo, ahora dentro de la
      # selección del runner junto a los ~70 que nadie ejecutaba automáticamente. El paso
      # explícito que duplicaba el primero se retiró el 2026-08-11 (decisión D-CI-1), cuando el
      # contrato pasó a comprobar que el CI lo ejecuta en vez de que lo nombra.
      - name: Correr la suite PHP completa que el CI puede honrar
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml exec -T app php scripts/run-php-tests.php --nivel=http
      # F-AB (2026-08-12): los dos gates que constaban `blocked` se enchufan AQUI,
      # antes de «Run laboratory gates», y no despues. Motivo medido: ese paso
      # falla hoy por goldens de una sola plataforma (D-GAC-4, abierta), y cuando
      # un paso falla GitHub salta todos los posteriores — por eso el gate de
      # persistencia de :144 no llego a ejecutarse en la corrida 31561660136.
      # Puestos aqui corren de verdad y dan procedencia real sin tocar un golden.
      # La app y la base aislada ya estan levantadas desde antes de :105, y las
      # cuatro variables CI_* ya vienen de «Capture runtime provenance» (:60-83):
      # NO se redeclaran, porque redeclararlas es el primer paso hacia fabricarlas.
      # Se ejecuta a traves de `gate-receipt.mjs` y no con el comando pelado, para
      # que la corrida deje su recibo: hasta hoy `full-app-flow` no podia declararse
      # `passed` en el indice aunque pasara, porque el contrato exige un artefacto
      # con `gateId` y `exitCode` producido por la ejecucion — y escribirlo a mano
      # es justo lo que ese contrato existe para impedir.
      #
      # OJO: `gate-receipt.mjs` **siempre sale 0** a proposito («su trabajo es
      # levantar acta, no aprobar»). Cableado tal cual, este paso saldria verde con
      # el gate en rojo. Por eso la segunda linea lee el recibo y propaga su
      # `exitCode`: el acta la levanta el script, el veredicto lo da el recibo.
      - name: Enforce full-app-flow gate
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: |
          node scripts/design-system/gate-receipt.mjs full-app-flow
          node -e "const r=require('./docs/design-system/evidence/full-app-flow.json'); if (r.exitCode !== 0) { console.error('full-app-flow en rojo: exitCode ' + r.exitCode); process.exit(1); }"
      - name: Preserve the full-app-flow receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-app-flow-receipt
          path: docs/design-system/evidence/full-app-flow.json
          if-no-files-found: error
      # `gate-receipt.mjs` escribe el recibo DENTRO del arbol, y eso lo ensucia.
      # `runtime-budgets` se niega a medir sobre un arbol sucio —«CI_WORKTREE_FINGERPRINT
      # must match the current clean worktree»— y hace bien: su procedencia dejaria
      # de ser comprobable. Medido en la corrida 31564632414, donde el paso de
      # medicion cayo por esto y no por presupuesto. Se restaura despues de subir
      # el recibo, que es cuando ya esta a salvo.
      - name: Restore the worktree after writing the receipt
        if: always()
        run: git checkout -- docs/design-system/evidence/full-app-flow.json && git status --porcelain
      # Roles y fases de la Semanal. Entra el 2026-08-14 y va DESPUES de full-app-flow por el
      # mismo motivo que aquel: la app aislada ya esta arriba y las cuatro variables CI_* vienen
      # de «Capture runtime provenance» — no se redeclaran, porque redeclararlas es el primer
      # paso hacia fabricarlas.
      #
      # Por que existe este paso: ampliar el fixture aislado (8a0d5e46) volvio ejecutable esta
      # suite, pero nada la ejecutaba. Cobertura disponible no es cobertura vigente.
      #
      # `E2E_PROJECT_KEYS` NO se pone a proposito: esta suite no itera `PROJECTS`, nombra sus
      # proyectos (Da Porto y JMC), y fijar la clave dejaria fuera al segundo.
      #
      # Las dos lineas del `run` son las de siempre y por la misma razon: `gate-receipt.mjs`
      # SIEMPRE sale 0 —su trabajo es levantar acta, no aprobar—, asi que la segunda lee el
      # recibo y propaga su `exitCode`. Sin ella, el paso saldria verde con el gate en rojo.
      - name: Enforce semanal roles and phases gate
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: |
          node scripts/design-system/gate-receipt.mjs semanal-roles-phases
          node -e "const r=require('./docs/design-system/evidence/semanal-roles-phases.json'); if (r.exitCode !== 0) { console.error('semanal-roles-phases en rojo: exitCode ' + r.exitCode); process.exit(1); }"
      - name: Preserve the semanal roles and phases receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semanal-roles-phases-receipt
          path: docs/design-system/evidence/semanal-roles-phases.json
          if-no-files-found: error
      - name: Restore the worktree after writing the semanal receipt
        if: always()
        run: git checkout -- docs/design-system/evidence/semanal-roles-phases.json && git status --porcelain
      - name: Measure runtime budgets
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:runtime-budget:measure
      - name: Check runtime budgets against the baseline
        run: npm run test:runtime-budget:check
      - name: Run laboratory gates
        id: blocking-runtime
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:runtime
      - name: Run pilot lab gates (Programa General)
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: |
          npm run test:visual:pilot
          npm run test:a11y:pilot
          npm run test:hue:pilot
      - name: Collect keyboard and reflow evidence
        id: keyboard-reflow-evidence
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:evidence
      - name: Preserve non-blocking evidence failures
        if: steps.keyboard-reflow-evidence.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-system-keyboard-reflow-evidence
          path: |
            test-results/
            test-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Run Programa General persistence and RBAC gate
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
          E2E_WORKERS: "1"
          E2E_HEADLESS: "true"
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/tests/workflows/pg-interactions.spec.mjs --workers=1
      - name: Preserve runtime logs
        if: failure()
        run: |
          mkdir -p test-output
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > test-output/docker-compose.log || true
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-system-failure-evidence
          path: |
            test-results/
            test-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated runtime
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml down --volumes
