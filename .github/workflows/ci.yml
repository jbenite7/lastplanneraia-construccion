name: Design System

# P2 Tarea 5 (G4, 2026-08-24): `paths-ignore` excluye lo que ningun gate de este workflow lee —
# `memoria/**` (wiki generada, sin efecto en codigo ni build) y los `.md` de RAIZ (README, TASKS,
# CHANGELOG, etc.). El patron `*.md` sin `**` en `paths-ignore` de Actions solo matchea archivos en
# la raiz del repo, no subcarpetas, asi que `docs/**/*.md` y `goals/**/*.md` NO quedan excluidos.
# `docs/design-system/` es contractual y NO se toca aqui a proposito: sus contratos son lo que
# `design-system-static` verifica.
on:
  pull_request:
    paths-ignore:
      - 'memoria/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'memoria/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sin esto, `docker-compose.override.yml` monta sobre /var/www/html la ruta absoluta de la
    # máquina de desarrollo, que en un runner NO EXISTE. Docker no protesta: crea el directorio
    # vacío y lo monta igual, así que el código desaparece del contenedor y los cuatro tests de
    # tests/design-system/foundation.test.mjs que ejecutan PHP caen con «Failed opening required
    # 'src/...'». El carril `node-tests` se pone rojo, y como design-system-runtime lleva
    # `needs: design-system-static`, el job de runtime deja de arrancar entero — con el measure y
    # el check de runtime-budgets dentro, que es como ese gate se quedó sin poder medirse nunca.
    #
    # Regresión del 2026-08-18: 86fdca41 cambió el bind de `./:/var/www/html` (que en CI
    # funcionaba) a `${LPS_CODE_ROOT:-<ruta del host>}`, y 81debea8 lo reapuntó al repo mudado.
    # No se toca el override: resuelve un problema local real —varios worktrees compartiendo los
    # mismos contenedores— y no existe una ruta que valga a la vez aquí y en un runner. La
    # variable ES la salida que aquel commit dejó prevista y que CLAUDE.md documenta («en otra
    # maquina, define LPS_CODE_ROOT en tu .env con la ruta de tu clon»); un runner es otra
    # máquina, y su clon es el workspace.
    #
    # Va en el job y no en un paso a propósito: los pasos que invocan compose con
    # `-f docker-compose.yml` explícito NO aplican el override y siguen sin montar nada, que es lo
    # que quieren —el montaje taparía el vendor/ que trae la imagen—. Esta variable solo cambia
    # las llamadas a `docker compose` pelado, que son las que hacen los tests.
    #
    # Y NO se replica en design-system-runtime, también a propósito: ese job fija
    # COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml, así que el override nunca se le
    # aplica; montar el checkout ahí taparía el vendor/ de la imagen y rompería PHPStan y la
    # suite PHP. Allí el arreglo sería el daño.
    #
    # Comprobado en las dos direcciones ANTES de escribirlo, en un proyecto de compose aparte:
    # con la ruta inexistente sale el «Failed opening required» idéntico al del CI; con la
    # variable puesta, DesignSystemHeadComponent::render() y DesignSystemAssetController::main()
    # devuelven su HTML y su CSS.
    env:
      LPS_CODE_ROOT: ${{ github.workspace }}
    steps:
      # P2 Tarea 7 (zizmor, 2026-08-24): `persist-credentials: false` en los dos checkout — zizmor
      # marcaba "credential persistence through GitHub Actions artifacts": sin esto, el token de
      # git queda escrito en `.git/config` del workspace del runner, disponible a cualquier paso
      # posterior que suba ese arbol como artefacto. Ningún paso de este workflow necesita
      # `git push` con el token del checkout (la publicación a `main` la hace `publicar.sh` desde
      # fuera de CI), así que no hay downside.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fija versión y checksum a propósito: un linter que se descarga mutable
      # es la misma brecha que vino a cerrar.
      - name: Lint the workflow definitions
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep ' actionlint_1.7.12_linux_amd64.tar.gz$' actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint_1.7.12_linux_amd64.tar.gz actionlint_1.7.12_checksums.txt
      - name: Fetch main history for design-system contracts
        run: git fetch origin main:refs/remotes/origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar dependencias del frontend
        run: npm ci --prefix frontend
      - name: Comprobar tipos del frontend
        run: npm run frontend:typecheck
      - name: Correr las pruebas del frontend
        run: npm run frontend:test
      # --build-arg COMPOSER_INSTALL_FLAGS="" para que la imagen traiga PHPUnit, que es
      # dependencia de desarrollo y sin ella el runner del paso siguiente aborta con 2 en
      # cuanto exista un test de nivel `puro` en tests/unit/. No se toca docker/php/Dockerfile
      # ni docker-compose.ci.yml: sus tres líneas de COMPOSER_INSTALL_FLAGS están fijadas por
      # tests/design-system/visual-ci-contract.test.mjs:143-145.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # El arg vacio trae las dependencias de desarrollo (PHPUnit); es el mismo
      # valor que antes pasaba compose. mode=min basta: el Dockerfile es de una
      # sola etapa y todas sus capas viven en la imagen final.
      - name: Build the PHP test runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/php/Dockerfile
          load: true
          tags: lps-aia-app-ci:local
          build-args: |
            COMPOSER_INSTALL_FLAGS=
          cache-from: type=gha
          cache-to: type=gha,mode=min
      # -f docker-compose.yml a propósito, para NO aplicar docker-compose.override.yml:
      # el override monta el checkout sobre /var/www/html y taparía el vendor/ que trae
      # la imagen, y este job no ejecuta composer install (vendor/ está en .gitignore).
      - name: Correr los tests PHP que no necesitan entorno
        run: docker compose -f docker-compose.yml run --rm --no-deps app php scripts/run-php-tests.php --nivel=puro
      - name: Enforce design-system static gates
        env:
          DS_ACTIVATION_STRICT: "1"
        run: npm run test:design-system:static
      - name: Enforce Programa General pilot contract
        run: node tests/test_programa_general_sprint_contract.mjs

  design-system-runtime:
    runs-on: ubuntu-latest
    # 60 -> 90 con la matriz de temas (D16, 2026-08-28). No es una medicion: es el
    # margen que pide la spec al desdoblar el job. Las dos patas corren EN
    # PARALELO, asi que el reloj de cada una no deberia moverse; el margen cubre
    # que compartan runners y cache de gha, no que se sumen.
    timeout-minutes: 90
    needs: design-system-static
    # D16 (spec temas 2026-08-28): el carril corre los DOS temas completos, no
    # solo el visual. Se desdobla el job entero y no un paso a proposito -- los
    # gates de a11y, teclado, reflow y presupuesto tambien viven aqui, y un tema
    # cuya evidencia solo cubre las capturas no esta cubierto.
    #
    # `fail-fast: false` para que un rojo en claro no cancele la pata oscura: son
    # dos veredictos distintos y el diagnostico necesita los dos.
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    env:
      # Lo consumen los carriles visuales (`*.visual.mjs`) para elegir QUE
      # escenarios del manifiesto corre esta pata. Sin el correrian los 44 en
      # cada una.
      E2E_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture runtime provenance
        id: runtime-provenance
        shell: bash
        run: |
          set -euo pipefail
          # El tema entra en el identificador de la corrida (D16, 2026-08-28)
          # para que las dos patas de la matriz no compartan ni contenedores ni
          # procedencia: `COMPOSE_PROJECT_NAME` se deriva de aqui, asi que basta
          # con sufijar este. Sigue cumpliendo el patron que exige el esquema de
          # runtime-budget (`^run-[a-z0-9][a-z0-9-]{5,48}$`).
          CI_RUN_ID=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.theme }}
          COMPOSE_PROJECT_NAME=lps-aia-design-system-ci-${CI_RUN_ID}
          provenance="$(node scripts/design-system-ci-preflight.mjs --print-provenance)"
          CI_GIT_SHA="$(awk -F= '$1 == "CI_GIT_SHA" { print $2 }' <<< "${provenance}")"
          CI_WORKTREE_FINGERPRINT="$(awk -F= '$1 == "CI_WORKTREE_FINGERPRINT" { print $2 }' <<< "${provenance}")"
          CI_FIXTURE_SHA256="$(awk -F= '$1 == "CI_FIXTURE_SHA256" { print $2 }' <<< "${provenance}")"
          for required_value in "${CI_GIT_SHA}" "${CI_WORKTREE_FINGERPRINT}" "${CI_FIXTURE_SHA256}"; do
            if ! grep -Eq '^[a-f0-9]+$' <<< "${required_value}"; then
              echo "Incomplete runtime provenance" >&2
              exit 1
            fi
          done
          {
            echo "CI_RUN_ID=${CI_RUN_ID}"
            echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml"
            echo "CI_GIT_SHA=${CI_GIT_SHA}"
            echo "CI_WORKTREE_FINGERPRINT=${CI_WORKTREE_FINGERPRINT}"
            echo "CI_FIXTURE_SHA256=${CI_FIXTURE_SHA256}"
          } >> "${GITHUB_ENV}"
      - name: Verify isolated runtime target
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: node scripts/design-system-ci-preflight.mjs
      # El espejo sin comentarios viene YA en el checkout: `public/dist-css/` se
      # versiona (ver .gitignore y .gitattributes), porque el codigo llega a
      # produccion por `git pull` y el servidor no corre Node.
      #
      # Aqui NO se genera, se VERIFICA. Generarlo enmascararia el unico fallo que
      # importa: si alguien edita una hoja y no regenera su copia, la URL cambia su
      # `?v=` y el cuerpo no —cache envenenada—. Un CI que lo arregla en silencio
      # deja pasar a `main` un desfase que el usuario si sufriria.
      #
      # El nombre del paso evita las palabras que `visual-ci-contract.test.mjs`
      # veta en este archivo: ese guard existe para que el CI no tenga camino de
      # despliegue, y un guard que se ablanda por comodidad deja de valer.
      - name: Verify the comment-free CSS matches its source
        run: npm run css:minify:check
      # El espejo de CSS viaja versionado desde 10dd634e, asi que el arbol ya
      # esta completo al construir; el build va tras la verificacion igualmente.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the isolated app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/php/Dockerfile
          load: true
          tags: lps-aia-app-ci:local
          build-args: |
            COMPOSER_INSTALL_FLAGS=
          cache-from: type=gha
          cache-to: type=gha,mode=min
      # La db de CI se sigue componiendo (su Dockerfile de fixture no entra en
      # este frente); app sube sin --build y usa la imagen pre-construida.
      - name: Start isolated runtime
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml build db
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml up -d db app
      - name: Wait for the application
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:18081/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1
      # P2 Tarea 2 (2026-08-24): los gates de aquí en adelante llevan `id` + `continue-on-error:
      # true`. Antes, el primero en romperse cancelaba TODOS los posteriores — GitHub Actions salta
      # el resto del job en cuanto un paso sin continue-on-error falla — y eso escondio el paso 25
      # («Run pilot lab gates») detrás de fallos anteriores tres veces en una jornada. Con esto cada
      # gate corre siempre; «Summarize gate results» al final decide si el job queda en rojo.
      - name: Enforce PHPStan baseline
        id: phpstan-baseline
        continue-on-error: true
        run: npm run test:design-system:phpstan
      - name: Enforce PHPStan level 6 on the PDC module
        id: phpstan-pdc
        continue-on-error: true
        run: npm run test:pdc:phpstan
      - name: Atestar grants efectivos de runtime
        id: runtime-grants
        continue-on-error: true
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml exec -T app php scripts/security/audit-runtime-db-grants.php --live
      # Sustituye a los tres tests que antes se listaban aquí a mano (test_global_table_safety,
      # test_dev_door_guard, test_dev_door_http): los tres siguen corriendo, ahora dentro de la
      # selección del runner junto a los ~70 que nadie ejecutaba automáticamente. El paso
      # explícito que duplicaba el primero se retiró el 2026-08-11 (decisión D-CI-1), cuando el
      # contrato pasó a comprobar que el CI lo ejecuta en vez de que lo nombra.
      - name: Correr la suite PHP completa que el CI puede honrar
        id: php-suite
        continue-on-error: true
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml exec -T app php scripts/run-php-tests.php --nivel=http
      # Lane no acumulativa para el único contrato que crea/elimina tablas legacy. La app y la
      # suite normal conservan DB_USER/DB_PASS runtime DML-only; estas variables existen solo en
      # este step y docker compose las inyecta únicamente en el proceso exec, no en el servicio.
      - name: Correr fixtures de migración con admin efímero
        id: php-admin-db
        continue-on-error: true
        env:
          DB_USER: root
          DB_PASS: ci-admin-only-password
          LPS_ADMIN_DB_LANE: "1"
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml exec -T -e DB_USER -e DB_PASS -e LPS_ADMIN_DB_LANE app php scripts/run-php-tests.php --nivel=admin-db
      # F-AB (2026-08-12): los dos gates que constaban `blocked` se enchufan AQUI,
      # antes de «Run laboratory gates», y no despues. Motivo medido: ese paso
      # falla hoy por goldens de una sola plataforma (D-GAC-4, abierta), y cuando
      # un paso falla GitHub salta todos los posteriores — por eso el gate de
      # persistencia de :144 no llego a ejecutarse en la corrida 31561660136.
      # Puestos aqui corren de verdad y dan procedencia real sin tocar un golden.
      # La app y la base aislada ya estan levantadas desde antes de :105, y las
      # cuatro variables CI_* ya vienen de «Capture runtime provenance» (:60-83):
      # NO se redeclaran, porque redeclararlas es el primer paso hacia fabricarlas.
      # Se ejecuta a traves de `gate-receipt.mjs` y no con el comando pelado, para
      # que la corrida deje su recibo: hasta hoy `full-app-flow` no podia declararse
      # `passed` en el indice aunque pasara, porque el contrato exige un artefacto
      # con `gateId` y `exitCode` producido por la ejecucion — y escribirlo a mano
      # es justo lo que ese contrato existe para impedir.
      #
      # OJO: `gate-receipt.mjs` **siempre sale 0** a proposito («su trabajo es
      # levantar acta, no aprobar»). Cableado tal cual, este paso saldria verde con
      # el gate en rojo. Por eso la segunda linea lee el recibo y propaga su
      # `exitCode`: el acta la levanta el script, el veredicto lo da el recibo.
      - name: Enforce full-app-flow gate
        id: full-app-flow
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: |
          node scripts/design-system/gate-receipt.mjs full-app-flow
          # G8 (P2 Tarea 6): la duracion sale a GITHUB_OUTPUT ANTES del checkout de mas abajo,
          # que restaura el arbol y borra este dato del recibo en disco. "Summarize gate results"
          # la vuelca al resumen sin tocar el recibo, que sigue siendo del script, no de este paso.
          node -e "const r=require('./docs/design-system/evidence/full-app-flow.json'); console.log('duration_ms=' + (r.durationMs ?? ''));" >> "$GITHUB_OUTPUT"
          node -e "const r=require('./docs/design-system/evidence/full-app-flow.json'); if (r.exitCode !== 0) { console.error('full-app-flow en rojo: exitCode ' + r.exitCode); process.exit(1); }"
      - name: Preserve the full-app-flow receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-app-flow-receipt-${{ matrix.theme }}
          path: docs/design-system/evidence/full-app-flow.json
          if-no-files-found: error
      # `gate-receipt.mjs` escribe el recibo DENTRO del arbol, y eso lo ensucia.
      # `runtime-budgets` se niega a medir sobre un arbol sucio —«CI_WORKTREE_FINGERPRINT
      # must match the current clean worktree»— y hace bien: su procedencia dejaria
      # de ser comprobable. Medido en la corrida 31564632414, donde el paso de
      # medicion cayo por esto y no por presupuesto. Se restaura despues de subir
      # el recibo, que es cuando ya esta a salvo.
      - name: Restore the worktree after writing the receipt
        if: always()
        run: git checkout -- docs/design-system/evidence/full-app-flow.json && git status --porcelain
      # Roles y fases de la Semanal. Entra el 2026-08-14 y va DESPUES de full-app-flow por el
      # mismo motivo que aquel: la app aislada ya esta arriba y las cuatro variables CI_* vienen
      # de «Capture runtime provenance» — no se redeclaran, porque redeclararlas es el primer
      # paso hacia fabricarlas.
      #
      # Por que existe este paso: ampliar el fixture aislado (8a0d5e46) volvio ejecutable esta
      # suite, pero nada la ejecutaba. Cobertura disponible no es cobertura vigente.
      #
      # `E2E_PROJECT_KEYS` NO se pone a proposito: esta suite no itera `PROJECTS`, nombra sus
      # proyectos (Da Porto y JMC), y fijar la clave dejaria fuera al segundo.
      #
      # Las dos lineas del `run` son las de siempre y por la misma razon: `gate-receipt.mjs`
      # SIEMPRE sale 0 —su trabajo es levantar acta, no aprobar—, asi que la segunda lee el
      # recibo y propaga su `exitCode`. Sin ella, el paso saldria verde con el gate en rojo.
      - name: Enforce semanal roles and phases gate
        id: semanal-roles-phases
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
        run: |
          node scripts/design-system/gate-receipt.mjs semanal-roles-phases
          node -e "const r=require('./docs/design-system/evidence/semanal-roles-phases.json'); console.log('duration_ms=' + (r.durationMs ?? ''));" >> "$GITHUB_OUTPUT"
          node -e "const r=require('./docs/design-system/evidence/semanal-roles-phases.json'); if (r.exitCode !== 0) { console.error('semanal-roles-phases en rojo: exitCode ' + r.exitCode); process.exit(1); }"
      - name: Preserve the semanal roles and phases receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semanal-roles-phases-receipt-${{ matrix.theme }}
          path: docs/design-system/evidence/semanal-roles-phases.json
          if-no-files-found: error
      - name: Restore the worktree after writing the semanal receipt
        if: always()
        run: git checkout -- docs/design-system/evidence/semanal-roles-phases.json && git status --porcelain
      - name: Measure runtime budgets
        id: runtime-budget-measure
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:runtime-budget:measure
      # Va AQUI, pegado a la medicion, por la misma razon que «Preserve pilot lab evidence»
      # (:424-431): `test-output/` es compartido y «Collect keyboard and reflow evidence» lo
      # pisa mas abajo. Medido el 2026-09-04 sobre la corrida 33901153624: el job fallo,
      # «Preserve failure evidence» se disparo, y su artefacto NO traia
      # `design-system-runtime-budget.json` — solo los dos directorios del teclado y el log.
      # Sin este paso la medicion de las seis metricas no sobrevive a ninguna corrida, ni verde
      # ni roja, y sin ella no hay forma de escribir un `<generacion>-measurement.json` con
      # procedencia real: la baseline se mide en el runner o no se mide (comentario de 0.4.0 en
      # scripts/design-system-runtime-budget.mjs). `always()` porque la medicion vale igual
      # cuando el check de abajo sale rojo — es justo entonces cuando hace falta leerla.
      - name: Preserve the runtime-budget measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-budget-measurement-${{ matrix.theme }}
          path: test-output/design-system-runtime-budget.json
          if-no-files-found: warn
      # P2 Tarea 3 (2026-08-24): Fase 2 de goals/runtime-budgets-al-ci quedaba "redactada y sin
      # aplicar" — envolver el check en `gate-receipt.mjs` para que la corrida deje recibo, igual
      # que full-app-flow y semanal-roles-phases. `closeout-evidence.json` ya declaraba el comando
      # para `runtime-budgets` (`gate-receipt.mjs` lo lee de ahi, no aqui), asi que cablearlo es
      # generico: sin esto, `runtime-budgets` no podia pasar de `blocked` a `passed` sin editar el
      # indice a mano, que es justo lo que este mecanismo existe para impedir.
      - name: Check runtime budgets against the baseline
        id: runtime-budget-check
        continue-on-error: true
        run: |
          node scripts/design-system/gate-receipt.mjs runtime-budgets
          node -e "const r=require('./docs/design-system/evidence/runtime-budgets.json'); console.log('duration_ms=' + (r.durationMs ?? ''));" >> "$GITHUB_OUTPUT"
          node -e "const r=require('./docs/design-system/evidence/runtime-budgets.json'); if (r.exitCode !== 0) { console.error('runtime-budgets en rojo: exitCode ' + r.exitCode); process.exit(1); }"
      - name: Preserve the runtime-budgets receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-budgets-receipt-${{ matrix.theme }}
          path: docs/design-system/evidence/runtime-budgets.json
          if-no-files-found: error
      - name: Restore the worktree after writing the runtime-budgets receipt
        if: always()
        run: git checkout -- docs/design-system/evidence/runtime-budgets.json && git status --porcelain
      # `blocking-runtime` es la única excepción deliberada de esta lista: sigue SIN
      # `continue-on-error` (tests/design-system/visual-ci-contract.test.mjs lo exige por
      # contrato — «CI tolerates keyboard and reflow evidence», que protege que el laboratorio
      # siga siendo genuinamente bloqueante y que `keyboard-reflow-evidence` sea la única
      # tolerancia). Si este paso falla, sí cancela lo que sigue — igual que antes de esta tarea —
      # pero el historial reciente no muestra que sea el cuello de botella: los tres escondites
      # medidos esta jornada fueron en pasos ANTERIORES a este, ya cubiertos arriba.
      - name: Run laboratory gates
        id: blocking-runtime
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:runtime
      - name: Run pilot lab gates (Programa General)
        id: pilot-lab-gates
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: |
          npm run test:visual:pilot
          npm run test:a11y:pilot
          npm run test:hue:pilot
      # Va AQUI, pegado al gate y no al final del job, porque `test-output/` es un
      # directorio compartido que cada suite sobrescribe. `pilot-lab-gates` no
      # bloquea (continue-on-error), asi que el job sigue, «Collect keyboard and
      # reflow evidence» pisa esa carpeta, y para cuando corren los dos pasos de
      # evidencia del final ya no queda rastro del piloto. Medido el 2026-08-28: un
      # golden del piloto en rojo y su artefacto sin una sola captura suya, asi que
      # no habia forma de aprobar el golden nuevo sin volver a correr el CI a
      # ciegas. Un gate que falla y no puede mostrar por que no es un gate.
      - name: Preserve pilot lab evidence
        if: steps.pilot-lab-gates.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-system-pilot-lab-evidence-${{ matrix.theme }}
          path: |
            test-results/
            test-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Collect keyboard and reflow evidence
        id: keyboard-reflow-evidence
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:18081
        run: npm run test:design-system:evidence
      - name: Preserve non-blocking evidence failures
        if: steps.keyboard-reflow-evidence.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-system-keyboard-reflow-evidence-${{ matrix.theme }}
          path: |
            test-results/
            test-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Run Programa General persistence and RBAC gate
        id: pg-persistence-rbac
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:18081
          E2E_BASE_URL: http://127.0.0.1:18081
          E2E_PROJECT_KEYS: construction
          E2E_REQUIRE_ISOLATED_DB: "1"
          E2E_ALLOW_DB_MUTATION: design-system-ci
          E2E_WORKERS: "1"
          E2E_HEADLESS: "true"
        run: npx playwright test --config=e2e/playwright.config.mjs e2e/tests/workflows/pg-interactions.spec.mjs --workers=1
      # G8 converge aqui (P2 Tarea 6): el resumen de que gate paso o fallo, en un solo lugar
      # legible sin abrir logs. Cada gate de arriba corrio SIEMPRE por su `continue-on-error`;
      # este paso es el unico que decide si el job queda en rojo, y lo hace mirando todos los
      # resultados juntos en vez de dejar que el primero en romperse tape a los demas.
      # `keyboard-reflow-evidence` se lista pero NO cuenta para el veredicto: ya era no bloqueante
      # antes de este cambio (tiene su propio artefacto de evidencia condicionado), y sigue
      # siendolo — este paso no le agrega peso que no tenia.
      - name: Summarize gate results
        if: always()
        env:
          G_PHPSTAN_BASELINE: ${{ steps.phpstan-baseline.outcome }}
          G_PHPSTAN_PDC: ${{ steps.phpstan-pdc.outcome }}
          G_RUNTIME_GRANTS: ${{ steps.runtime-grants.outcome }}
          G_PHP_SUITE: ${{ steps.php-suite.outcome }}
          G_PHP_ADMIN_DB: ${{ steps.php-admin-db.outcome }}
          G_FULL_APP_FLOW: ${{ steps.full-app-flow.outcome }}
          G_SEMANAL_ROLES_PHASES: ${{ steps.semanal-roles-phases.outcome }}
          G_RUNTIME_BUDGET_MEASURE: ${{ steps.runtime-budget-measure.outcome }}
          G_RUNTIME_BUDGET_CHECK: ${{ steps.runtime-budget-check.outcome }}
          G_LABORATORY_GATES: ${{ steps.blocking-runtime.outcome }}
          G_PILOT_LAB_GATES: ${{ steps.pilot-lab-gates.outcome }}
          G_KEYBOARD_REFLOW_EVIDENCE: ${{ steps.keyboard-reflow-evidence.outcome }}
          G_PG_PERSISTENCE_RBAC: ${{ steps.pg-persistence-rbac.outcome }}
          G_FULL_APP_FLOW_MS: ${{ steps.full-app-flow.outputs.duration_ms }}
          G_SEMANAL_ROLES_PHASES_MS: ${{ steps.semanal-roles-phases.outputs.duration_ms }}
          G_RUNTIME_BUDGET_CHECK_MS: ${{ steps.runtime-budget-check.outputs.duration_ms }}
        run: |
          {
            echo "## Resultado de los gates del piloto"
            echo ""
            echo "| Gate | Resultado |"
            echo "| --- | --- |"
            echo "| Enforce PHPStan baseline | ${G_PHPSTAN_BASELINE} |"
            echo "| Enforce PHPStan level 6 on the PDC module | ${G_PHPSTAN_PDC} |"
            echo "| Atestar grants efectivos de runtime | ${G_RUNTIME_GRANTS} |"
            echo "| Correr la suite PHP completa que el CI puede honrar | ${G_PHP_SUITE} |"
            echo "| Correr fixtures de migración con admin efímero | ${G_PHP_ADMIN_DB} |"
            echo "| Enforce full-app-flow gate | ${G_FULL_APP_FLOW} |"
            echo "| Enforce semanal roles and phases gate | ${G_SEMANAL_ROLES_PHASES} |"
            echo "| Measure runtime budgets | ${G_RUNTIME_BUDGET_MEASURE} |"
            echo "| Check runtime budgets against the baseline | ${G_RUNTIME_BUDGET_CHECK} |"
            echo "| Run laboratory gates | ${G_LABORATORY_GATES} |"
            echo "| Run pilot lab gates (Programa General) | ${G_PILOT_LAB_GATES} |"
            echo "| Collect keyboard and reflow evidence (no bloqueante) | ${G_KEYBOARD_REFLOW_EVIDENCE} |"
            echo "| Run Programa General persistence and RBAC gate | ${G_PG_PERSISTENCE_RBAC} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # G7/G8 (P2 Tarea 6): los recibos y presupuestos ya se generan; lo unico que faltaba
          # era volcarlos donde se leen sin abrir logs. `full-app-flow`/`semanal-roles-phases`
          # traen `durationMs` propio (ver los `duration_ms` de arriba); `runtime-budget.mjs`
          # escribe sus metricas en `test-output/`, que NO se restaura (a diferencia de los
          # recibos en `docs/design-system/evidence/`), asi que se lee del disco tal cual.
          {
            echo ""
            echo "## Duración y presupuesto"
            echo ""
            echo "| Recibo | Duración |"
            echo "| --- | --- |"
            echo "| full-app-flow | ${G_FULL_APP_FLOW_MS:-sin dato} ms |"
            echo "| semanal-roles-phases | ${G_SEMANAL_ROLES_PHASES_MS:-sin dato} ms |"
            echo "| runtime-budgets | ${G_RUNTIME_BUDGET_CHECK_MS:-sin dato} ms |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output/design-system-runtime-budget.json ]; then
            node -e "
              const r = require('./test-output/design-system-runtime-budget.json');
              const rows = Object.entries(r.metrics ?? {})
                .filter(([, v]) => typeof v === 'number')
                .map(([k, v]) => '| ' + k + ' | ' + v + ' |')
                .join('\n');
              console.log('');
              console.log('| Métrica de runtime budget | Valor medido |');
              console.log('| --- | --- |');
              console.log(rows);
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Sin \`test-output/design-system-runtime-budget.json\`: \`Measure runtime budgets\` no llegó a escribirlo._" >> "$GITHUB_STEP_SUMMARY"
          fi
          failed=0
          for outcome in "$G_PHPSTAN_BASELINE" "$G_PHPSTAN_PDC" "$G_RUNTIME_GRANTS" "$G_PHP_SUITE" "$G_PHP_ADMIN_DB" "$G_FULL_APP_FLOW" \
            "$G_SEMANAL_ROLES_PHASES" "$G_RUNTIME_BUDGET_MEASURE" "$G_RUNTIME_BUDGET_CHECK" \
            "$G_LABORATORY_GATES" "$G_PILOT_LAB_GATES" "$G_PG_PERSISTENCE_RBAC"; do
            if [ "$outcome" = "failure" ]; then
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "::error::Al menos un gate bloqueante falló. Ver la tabla de resultados arriba."
            exit 1
          fi
      - name: Preserve runtime logs
        if: failure()
        run: |
          mkdir -p test-output
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > test-output/docker-compose.log || true
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-system-failure-evidence-${{ matrix.theme }}
          path: |
            test-results/
            test-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated runtime
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.ci.yml down --volumes
