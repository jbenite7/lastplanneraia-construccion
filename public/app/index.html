    <title>Last Planner AIA</title>
    <script>
      document.documentElement.setAttribute('data-aia-theme', 'light');
      try {
        var tema = localStorage.getItem('aia-theme');
        if (tema === 'dark') {
          document.documentElement.setAttribute('data-aia-theme', 'dark');
          document.documentElement.classList.add('aia-theme-dark');
        }
      } catch (error) {}
      if (location.pathname === '/programa-general' || location.pathname === '/app/programa-general') {
        document.body ? document.body.classList.add('pg-page') : document.addEventListener('DOMContentLoaded', function() { if (document.body) document.body.classList.add('pg-page'); });
      }
    </script>
    <link rel="stylesheet" href="/css/tokens.css" />
