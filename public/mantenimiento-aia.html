<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AIA - Actualizando Aplicación</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --aia-green-primary: #1a5633;
        --aia-green-medium: #4a7c64;
        --aia-green-light: #8cb4a1;
        --aia-green-very-light: #d5e5db;
        --aia-text-primary: #1c1c1e;
        --aia-text-secondary: #4a4a4d;
        --aia-bg-linen: #f4f1ea;
        --font-heading: "Montserrat", sans-serif;
        --font-body: "Inter", sans-serif;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--font-body);
        background: var(--aia-bg-linen);
        color: var(--aia-text-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        text-align: center;
        max-width: 560px;
      }

      .logo {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 1.75rem;
        color: var(--aia-green-primary);
        letter-spacing: -0.02em;
        margin-bottom: 48px;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid var(--aia-green-very-light);
        border-top-color: var(--aia-green-primary);
        border-radius: 50%;
        margin: 0 auto 32px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      h1 {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 2.25rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: var(--aia-green-primary);
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 1.125rem;
        font-weight: 400;
        color: var(--aia-text-secondary);
        line-height: 1.6;
        margin-bottom: 40px;
      }

      .divider {
        width: 48px;
        height: 2px;
        background: var(--aia-green-light);
        margin: 0 auto 24px;
      }

      .tagline {
        font-family: var(--font-body);
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--aia-green-medium);
        letter-spacing: 0.05em;
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.75rem;
        }

        .subtitle {
          font-size: 1rem;
        }

        .logo {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="logo">AIA</div>

      <div class="spinner" role="status" aria-label="Actualizando"></div>

      <h1>Estamos actualizando la aplicación</h1>

      <p class="subtitle">
        Estamos mejorando tu experiencia para ofrecerte un servicio más
        confiable y eficiente. Volveremos pronto.
      </p>

      <div class="divider"></div>

      <p class="tagline">Somos progreso que se construye con propósito</p>
    </main>
  </body>
</html>
