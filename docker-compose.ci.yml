services:
  app:
    image: lps-aia-design-system-ci:${CI_RUN_ID:?CI_RUN_ID is required}
    build:
      args:
        COMPOSER_INSTALL_FLAGS: ""
    labels:
      aia.ci.run-id: ${CI_RUN_ID:?CI_RUN_ID is required}
      aia.ci.git-sha: ${CI_GIT_SHA:?CI_GIT_SHA is required}
      aia.ci.worktree-fingerprint: ${CI_WORKTREE_FINGERPRINT:?CI_WORKTREE_FINGERPRINT is required}
      aia.ci.fixture-sha256: ${CI_FIXTURE_SHA256:?CI_FIXTURE_SHA256 is required}
    ports: !override
      - "18081:80"
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lastplanneraia_ci
      DB_USER: root
      DB_PASS: ci-only-password
      USE_GLOBAL_TABLES: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: lps-aia-design-system-ci-db:${CI_RUN_ID:?CI_RUN_ID is required}
    build:
      context: .
      dockerfile: database/fixtures/design-system-ci.Dockerfile
    labels:
      aia.ci.run-id: ${CI_RUN_ID:?CI_RUN_ID is required}
      aia.ci.git-sha: ${CI_GIT_SHA:?CI_GIT_SHA is required}
      aia.ci.worktree-fingerprint: ${CI_WORKTREE_FINGERPRINT:?CI_WORKTREE_FINGERPRINT is required}
      aia.ci.fixture-sha256: ${CI_FIXTURE_SHA256:?CI_FIXTURE_SHA256 is required}
    ports: !override
      - "13307:3306"
    environment:
      MYSQL_DATABASE: lastplanneraia_ci
      MYSQL_ROOT_PASSWORD: ci-only-password
    volumes: !override
      - db_data:/var/lib/mysql
    restart: "no"

  adminer:
    profiles: ["manual"]
    restart: "no"

volumes:
  db_data:
    external: false
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}_db
