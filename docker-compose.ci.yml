services:
  app:
    image: lps-aia-design-system-ci:${CI_RUN_ID:?CI_RUN_ID is required}
    build:
      args:
        COMPOSER_INSTALL_FLAGS: ""
    labels:
      aia.ci.run-id: ${CI_RUN_ID:?CI_RUN_ID is required}
      aia.ci.git-sha: ${CI_GIT_SHA:?CI_GIT_SHA is required}
      aia.ci.worktree-fingerprint: ${CI_WORKTREE_FINGERPRINT:?CI_WORKTREE_FINGERPRINT is required}
      aia.ci.fixture-sha256: ${CI_FIXTURE_SHA256:?CI_FIXTURE_SHA256 is required}
    ports: !override
      - "18081:80"
    environment:
      APP_ENV: testing
      # La puerta de servicio se abre en el runtime de CI para poder probarla extremo a
      # extremo (tests/test_dev_door_http.php). Es un contenedor efímero y aislado; el
      # blindaje de producción lo demuestra tests/test_dev_door_guard.php, que no depende
      # de este entorno.
      DEV_DOOR: "1"
      DEV_DOOR_USERS: "test.A,test.R,test.V,test.C,test.D"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lastplanneraia_ci
      DB_USER: ${CI_DB_RUNTIME_USER:-lps_runtime_ci}
      DB_PASS: ${CI_DB_RUNTIME_PASS:-ci-runtime-only-password}
      USE_GLOBAL_TABLES: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: lps-aia-design-system-ci-db:${CI_RUN_ID:?CI_RUN_ID is required}
    build:
      context: .
      dockerfile: database/fixtures/design-system-ci.Dockerfile
    labels:
      aia.ci.run-id: ${CI_RUN_ID:?CI_RUN_ID is required}
      aia.ci.git-sha: ${CI_GIT_SHA:?CI_GIT_SHA is required}
      aia.ci.worktree-fingerprint: ${CI_WORKTREE_FINGERPRINT:?CI_WORKTREE_FINGERPRINT is required}
      aia.ci.fixture-sha256: ${CI_FIXTURE_SHA256:?CI_FIXTURE_SHA256 is required}
    ports: !override
      - "13307:3306"
    environment:
      MYSQL_DATABASE: lastplanneraia_ci
      MYSQL_USER: ${CI_DB_RUNTIME_USER:-lps_runtime_ci}
      MYSQL_PASSWORD: ${CI_DB_RUNTIME_PASS:-ci-runtime-only-password}
      MYSQL_ROOT_PASSWORD: ${CI_DB_ADMIN_PASS:-ci-admin-only-password}
      MYSQL_ROOT_HOST: "%"
    volumes: !override
      - db_data:/var/lib/mysql
    restart: "no"

  adminer:
    profiles: ["manual"]
    restart: "no"

volumes:
  db_data:
    external: false
    name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}_db
