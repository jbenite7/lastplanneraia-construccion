name: last-planner-aia

services:
  app:
    # Tag fijo: en CI la imagen se pre-construye con buildx (cache gha) y el
    # `up` sin --build la encuentra por este nombre. En local no cambia nada.
    image: lps-aia-app-ci:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8081:80"
    environment:
      TZ: America/Bogota
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: ${DOCKER_APP_DB_HOST:-db}
      DB_PORT: ${DOCKER_APP_DB_PORT:-3306}
      # NO QUITES estas tres de aqui. Parece que sobran —la app tambien las leeria del .env
      # montado, como hace con las MAIL_*— y el 2026-08-18 se quitaron por eso. Fue un error:
      # `public/index.php` carga Dotenv, pero los `tests/test_*.php` NO, asi que el PHP de CLI
      # depende de este bloque y solo de este. Quitarlas dejaba la web en verde y reventaba
      # `docker compose exec app php tests/test_global_table_safety.php` —la via canonica de
      # AGENTS.md— con «Access denied for user ''». Ver memoria/trampas/.
      # El problema que aquello intentaba resolver (llegan VACIAS al ejecutar compose desde un
      # worktree, y una variable vacia cuenta como "ya definida" para Dotenv) se resuelve con el
      # enlace del .env en cada worktree, documentado en CLAUDE.md.
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_RUNTIME_USER}
      DB_PASS: ${DB_RUNTIME_PASS}
      USE_GLOBAL_TABLES: "true"
    restart: unless-stopped

  db:
    image: mysql:8.0.40
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    environment:
      TZ: America/Bogota
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_RUNTIME_USER}
      MYSQL_PASSWORD: ${DB_RUNTIME_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS}
    configs:
      - source: runtime_db_least_privilege
        target: /docker-entrypoint-initdb.d/999-runtime-user-dml.sh
        mode: 0444
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    ports:
      - "${DOCKER_ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    restart: unless-stopped

configs:
  runtime_db_least_privilege:
    content: |
      #!/bin/bash
      if ! printenv MYSQL_USER | grep -Eq '^[A-Za-z0-9_]+$' \
        || ! printenv MYSQL_DATABASE | grep -Eq '^[A-Za-z0-9_]+$'; then
        echo 'Runtime DB user/database missing; refusing least-privilege initialization.' >&2
        return 1
      fi
      if [ "$(printenv MYSQL_USER)" = root ]; then
        echo 'Runtime DB user cannot be root.' >&2
        return 1
      fi
      docker_process_sql <<EOSQL
      REVOKE ALL PRIVILEGES, GRANT OPTION FROM '$(printenv MYSQL_USER)'@'%';
      GRANT SELECT, INSERT, UPDATE, DELETE ON \`$(printenv MYSQL_DATABASE)\`.* TO '$(printenv MYSQL_USER)'@'%';
      EOSQL

volumes:
  db_data:
    external: true
    name: htdocs_db_data
